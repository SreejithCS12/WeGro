<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wegro-maskable-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="bolt-maskable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf4ff" />
    </linearGradient>
    <filter id="maskable-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Canvas Background matching PWA theme -->
  <rect width="512" height="512" fill="#09090b" />

  <!-- Centered Safe-Zone Squircle (Size 280x280 centered within 512x512) -->
  <rect x="116" y="116" width="280" height="280" rx="64" fill="url(#wegro-maskable-bg)" />
  <rect x="116" y="116" width="280" height="280" rx="64" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" />

  <!-- Central Electric Lightning Bolt -->
  <g transform="translate(186, 176) scale(5.8)">
    <path
      d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"
      fill="url(#bolt-maskable-grad)"
      stroke="#ffffff"
      stroke-width="0.8"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#maskable-glow)"
    />
  </g>

  <!-- Star Accent -->
  <g transform="translate(320, 150) scale(1.4)">
    <path
      d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"
      fill="#ffffff"
      filter="url(#maskable-glow)"
    />
  </g>
</svg>
