<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wegro-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#wegro-bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Inner Ambient Glow Depth -->
  <circle cx="380" cy="130" r="140" fill="rgba(236, 72, 153, 0.35)" filter="url(#glow)" />
  <circle cx="130" cy="380" r="140" fill="rgba(109, 40, 217, 0.45)" filter="url(#glow)" />

  <!-- Central Electric Lightning Bolt -->
  <g transform="translate(136, 120) scale(10)">
    <path
      d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"
      fill="url(#bolt-grad)"
      stroke="#ffffff"
      stroke-width="0.8"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#glow)"
    />
  </g>

  <!-- Top-Right Sparkle / Star -->
  <g transform="translate(360, 95) scale(2.2)">
    <path
      d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"
      fill="#fdf4ff"
      filter="url(#glow)"
    />
  </g>
</svg>
